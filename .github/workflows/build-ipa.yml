name: IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: YouTube IPA URL (iOS 17+ base, 21.44.4)
        required: true
        default: "https://www.dropbox.com/scl/fi/5t2vjoy3om4z25vr9al4x/com.google.ios.youtube-21.44.4-eeveedecrypter.ipa?rlkey=3trqmmwud6ieittgiuwk9h6oy&st=xvpxx0rv&dl=1"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: python3 -m unittest discover -s Tests -v

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="rootless" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1

      - name: Name package
        id: name
        run: |
          deb="$(ls packages/*.deb | head -1)"
          version="$(awk '/^Version:/ {print $2}' control)"
          output="com.itzzace.ytkace_${version}_rootless.deb"
          mkdir -p artifacts
          cp "$deb" "artifacts/$output"
          echo "deb=artifacts/$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-rootless
          path: ${{ steps.name.outputs.deb }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup
        run: brew install ldid dpkg

      - name: YouTube
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl --fail --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$IPA_URL" --output YouTube.ipa
          else
            curl --fail --location "$IPA_URL" --output YouTube.ipa
          fi
          file_type=$(file --mime-type -b YouTube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            exit 1
          fi

      - name: Inject
        id: inject
        run: |
          mkdir deb-root
          dpkg-deb -x packages/*.deb deb-root
          export LDID="$(brew --prefix)/bin/ldid"
          tweak_version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile('YouTube.ipa') as archive:
              info = next(name for name in archive.namelist()
                          if name.startswith('Payload/') and name.endswith('.app/Info.plist'))
              print(plistlib.loads(archive.read(info))['CFBundleShortVersionString'])
          PY
          )"
          output="YTKACE_${tweak_version}_YouTube_${youtube_version}.ipa"
          bash Scripts/sideload-repack.sh YouTube.ipa deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          bash Tools/verify-artifacts.sh deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error
